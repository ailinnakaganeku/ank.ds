name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Tokens in sync
        run: npm run tokens:check

      - name: Lint
        run: npm run lint

      - name: Lint styles
        run: npm run lint:css

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps --no-shell chromium

      - name: Test
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook
